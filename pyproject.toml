[project]
name = "alem-minutes"
version = "0.1.0"
description = "Local Russian/Kazakh meeting transcription and action protocols"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.45,<2",
  "faster-whisper>=1.2,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12>=12,<13", "nvidia-cudnn-cu12>=9,<10"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
